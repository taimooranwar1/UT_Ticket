<title>Hell In a Cell Trade Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a trade desk. Controls and the trade builder up top, the verdict strip, then tabbed detail (regular season / playoffs / players / league / method). */
:root {
  --bg: #f3f5f3;
  --panel: #ffffff;
  --panel-2: #eef1ee;
  --ink: #121714;
  --ink-2: #4a534e;
  --ink-3: #737c77;
  --line: #d9dfda;
  --flag: #f2c230;          /* penalty-flag yellow: selection + primary actions */
  --flag-ink: #241c00;
  --a: #2a78d6;             /* team A series (blue) */
  --b: #eb6834;             /* team B series (orange) */
  --base: #a3aba6;          /* "without trade" baseline */
  --good: #0a7a0a;
  --bad: #c42e2e;
  --warn: #9a6a00;
  --serious: #ec835a;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --panel: #181d1a; --panel-2: #1f2521; --ink: #edf1ee; --ink-2: #b6beb9; --ink-3: #87908b;
    --line: #2c332f; --flag: #f2c230; --flag-ink: #241c00; --a: #3987e5; --b: #d95926; --base: #646d68;
    --good: #45c445; --bad: #ec6b6b; --warn: #e2b23c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --panel: #181d1a; --panel-2: #1f2521; --ink: #edf1ee; --ink-2: #b6beb9; --ink-3: #87908b;
  --line: #2c332f; --flag: #f2c230; --flag-ink: #241c00; --a: #3987e5; --b: #d95926; --base: #646d68;
  --good: #45c445; --bad: #ec6b6b; --warn: #e2b23c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: 2.1rem; line-height: 1; text-transform: uppercase; }
h2 { font-size: 1.35rem; text-transform: uppercase; }
h3 { font-size: 1.08rem; text-transform: uppercase; letter-spacing: .03em; }
.num, td, .tab { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--flag); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.top .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-2); font-size: 12.5px; }
.top .meta b { color: var(--ink); font-weight: 600; }
.settings { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.settings label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.settings select, .settings input[type=range] { accent-color: var(--a); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
.settings output { font-weight: 600; color: var(--ink); min-width: 3ch; display: inline-block; }

/* trade builder */
.builder { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 860px) { .builder { grid-template-columns: 1fr; } }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; display: flex; flex-direction: column; }
.side-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.side-head select { font-weight: 600; max-width: 100%; min-width: 0; flex: 1 1 180px; }
.rec { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.roster { max-height: 360px; overflow-y: auto; }
.prow { display: grid; grid-template-columns: 22px 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.prow:last-child { border-bottom: 0; }
.prow:hover { background: var(--panel-2); }
.prow.sel { background: color-mix(in srgb, var(--flag) 22%, var(--panel)); }
.prow input { accent-color: var(--flag-ink); margin: 0; }
.pos { font-family: var(--font-display); font-weight: 600; font-size: 12px; text-align: center; border: 1px solid var(--line); border-radius: 3px; padding: 0 2px; color: var(--ink-2); }
.pname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname .tm { color: var(--ink-3); font-size: 12px; margin-left: 4px; }
.pval { font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.pill { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; border-radius: 3px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }
.pill.inj { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.pill.q { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.ir { background: var(--panel-2); color: var(--ink-3); }
.side-foot { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); min-height: 36px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--flag); color: var(--flag-ink); border-radius: 3px; padding: 1px 7px; font-weight: 600; font-size: 12px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 5px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--flag); color: var(--flag-ink); border-color: var(--flag); font-weight: 600; }
.status { font-size: 12.5px; color: var(--ink-2); }

/* verdict */
.verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.verdict .fair { grid-column: 1 / -1; }
.fairgrid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px 28px; }
@media (max-width: 860px) { .fairgrid { grid-template-columns: 1fr; } }
.fairgrid > div { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.fitlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.fitlist li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.fitlist b { color: var(--ink); }
.fitlist .arrow { color: var(--ink-3); }
@media (max-width: 600px) { .verdict { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.vhead { display: flex; align-items: center; gap: 8px; }
.vhead h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi .lbl { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.kpi .big { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; line-height: 1.05; }
.kpi .from { font-size: 12px; color: var(--ink-2); }
.delta { font-weight: 600; white-space: nowrap; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.delta.flat { color: var(--ink-3); }
.verdict-line { font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 8px; }
.verdict-line b { color: var(--ink); }

/* fairness meter */
.meter { position: relative; height: 34px; margin: 4px 0 2px; }
.meter .track { position: absolute; left: 0; right: 0; top: 11px; height: 12px; border-radius: 4px; overflow: hidden; background: var(--panel-2); }
.band { position: absolute; top: 0; bottom: 0; }
.band.b-fair { background: color-mix(in srgb, var(--good) 45%, var(--panel)); }
.band.b-good { background: color-mix(in srgb, var(--good) 18%, var(--panel)); }
.band.b-bad { background: color-mix(in srgb, var(--serious) 28%, var(--panel)); }
.band.b-terr { background: color-mix(in srgb, var(--bad) 38%, var(--panel)); }
.bandlabels { display: grid; grid-template-columns: 16.667fr 13.333fr 10fr 20fr 10fr 13.333fr 16.667fr; font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; text-align: center; }
@media (max-width: 520px) { .bandlabels { display: none; } }
.grade { font-size: 12.5px; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-2); }
.grade b { color: var(--ink); }
.grade.great { background: color-mix(in srgb, var(--good) 22%, var(--panel)); border-color: color-mix(in srgb, var(--good) 50%, var(--panel)); }
.grade.fair { background: color-mix(in srgb, var(--good) 10%, var(--panel)); }
.grade.good { background: var(--panel-2); }
.grade.bad { background: color-mix(in srgb, var(--serious) 22%, var(--panel)); border-color: color-mix(in srgb, var(--serious) 50%, var(--panel)); }
.grade.terrible { background: color-mix(in srgb, var(--bad) 20%, var(--panel)); border-color: color-mix(in srgb, var(--bad) 50%, var(--panel)); }
.valrow.four { grid-template-columns: minmax(0, 1fr) auto auto auto; }
.valrow.four span:nth-child(4n+2), .valrow.four span:nth-child(4n+3), .valrow.four span:nth-child(4n) { text-align: right; }
.valrow.four span:nth-child(4n+1) { text-align: left; }
.meter .needle { position: absolute; top: 2px; width: 4px; height: 30px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--panel); transition: left .3s; }
.meter-labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-2); gap: 8px; }
.valrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; font-size: 12.5px; }
.valrow .h { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.valrow span:nth-child(3n+2), .valrow span:nth-child(3n) { text-align: right; }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; cursor: pointer; font-family: var(--font-display); font-size: 1.02rem; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-2); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--flag); }
.panel { display: flex; flex-direction: column; gap: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 4px 12px; cursor: pointer; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--panel-2); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* week cards */
.weeks { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
.wk { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.wk-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.wk-top .w { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; text-transform: uppercase; }
.wk-top .opp { font-size: 12.5px; color: var(--ink-2); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 1px 5px; border-radius: 3px; background: var(--panel-2); color: var(--ink-2); }
.scoreline { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; font-size: 12.5px; align-items: baseline; }
.scoreline .v { text-align: right; font-weight: 600; }
.bars { display: flex; flex-direction: column; gap: 4px; }
.bar { display: grid; grid-template-columns: 74px 1fr 42px; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
.bar .t { height: 12px; background: var(--panel-2); border-radius: 0 4px 4px 0; position: relative; }
.bar .f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; transition: width .3s; }
.bar .t .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ink-3); opacity: .5; }
.bar .v { text-align: right; font-weight: 600; color: var(--ink); }
.changes { font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 6px; }
.changes .in { color: var(--good); font-weight: 600; }
.changes .out { color: var(--bad); font-weight: 600; }

/* tables */
.tblwrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.me td { background: color-mix(in srgb, var(--flag) 10%, transparent); }
.mini { display: inline-block; width: 70px; height: 8px; background: var(--panel-2); border-radius: 0 3px 3px 0; position: relative; vertical-align: middle; margin-right: 6px; }
.mini i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 3px 3px 0; }
.cut td { border-bottom: 2px dashed var(--ink-3); }

/* seed chart */
.seedchart { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; align-items: end; height: 150px; padding-top: 6px; }
.seedcol { display: flex; flex-direction: column; align-items: stretch; gap: 4px; height: 100%; justify-content: flex-end; }
.seedbars { display: flex; gap: 2px; align-items: flex-end; flex: 1; }
.seedbars i { flex: 1; border-radius: 4px 4px 0 0; min-height: 1px; transition: height .3s; }
.seedcol .lab { text-align: center; font-size: 11.5px; color: var(--ink-2); }
.seedcol .lab.po { color: var(--ink); font-weight: 600; }

.tf-controls { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.tf-controls label { display: flex; align-items: center; gap: 6px; }
.pill.ok { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.ideas { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .ideas { grid-template-columns: 1fr; } }
.idea { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.idea-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: center; }
.swap { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.arrow-big { font-size: 20px; color: var(--ink-3); }
.tchips { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.tchip { display: flex; align-items: center; gap: 6px; font-size: 12.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idea-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 8px; }
@media (max-width: 420px) { .idea-stats { grid-template-columns: 1fr; } }
.idea-stats > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.idea-stats .lbl { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.idea-stats b { color: var(--ink); }
.player { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.player-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: center; }
.player-head .nm { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; }
.basemix { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); padding: 8px 12px; border-bottom: 1px solid var(--line); }
.basemix b { color: var(--ink); }
.ovr { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; }
.ovr input[type=number] { width: 62px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
.prose { max-width: 70ch; display: flex; flex-direction: column; gap: 10px; color: var(--ink-2); }
.prose h3 { color: var(--ink); margin-top: 6px; }
.prose b { color: var(--ink); }
.prose ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--panel-2); border-radius: var(--r); padding: 10px 12px; }
.empty { padding: 26px; text-align: center; color: var(--ink-2); background: var(--panel); border: 1px dashed var(--line); border-radius: var(--r); }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 4px; max-width: 280px; line-height: 1.35; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.loading { padding: 40px; text-align: center; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="lg-eyebrow">ESPN league · 8 teams · top 4 make the playoffs</div>
      <h1 id="lg-name">Hell In a Cell Trade Desk</h1>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <section class="settings" aria-label="Simulation settings">
    <label for="eff">Trade takes effect
      <select id="eff">
        <option value="11">Week 11 (rest of this week)</option>
        <option value="12" selected>Week 12</option>
        <option value="13">Week 13</option>
        <option value="14">Week 14</option>
      </select>
    </label>
    <label for="shrink">Matchup weight <input id="shrink" type="range" min="0" max="1" step="0.05" value="0.25"> <output id="shrink-o">25%</output></label>
    <label for="regw">Goal: playoffs <input id="regw" type="range" min="0" max="1" step="0.05" value="0.5"> title <output id="regw-o">50/50</output></label>
    <label for="nsim">Simulations
      <select id="nsim"><option value="2000">2,000</option><option value="6000" selected>6,000</option><option value="20000">20,000</option></select>
    </label>
    <label for="fill"><input id="fill" type="checkbox" checked> Fill open roster spots from free agents</label>
  </section>

  <section class="builder" aria-label="Trade builder">
    <div class="side" id="sideA"></div>
    <div class="side" id="sideB"></div>
  </section>
  <div class="actions">
    <button class="btn" id="swap" type="button">Swap sides</button>
    <button class="btn" id="clear" type="button">Clear trade</button>
    <span class="status" id="status"></span>
  </div>

  <section class="verdict" id="verdict" aria-live="polite"></section>

  <nav class="tabs" role="tablist" aria-label="Detail views">
    <button class="tab" role="tab" id="t-reg" aria-selected="true" data-tab="reg">Regular season · Wk 11–14</button>
    <button class="tab" role="tab" id="t-po" aria-selected="false" data-tab="po">Playoffs · Wk 15–17</button>
    <button class="tab" role="tab" id="t-pl" aria-selected="false" data-tab="pl">Players</button>
    <button class="tab" role="tab" id="t-tf" aria-selected="false" data-tab="tf">Trade finder</button>
    <button class="tab" role="tab" id="t-lg" aria-selected="false" data-tab="lg">League</button>
    <button class="tab" role="tab" id="t-me" aria-selected="false" data-tab="me">Method</button>
  </nav>
  <section class="panel" id="panel"><div class="loading">Loading league data…</div></section>
</div>
<div id="tip" hidden></div>

<script>
(() => {
"use strict";
let D, PL, BYID, TEAMS, TEAM, NFLIDX;
const WEEKS = [11, 12, 13, 14, 15, 16, 17]; let REG = [11, 12, 13, 14];

// All times shown in US Central (handles CST/CDT automatically)

}
const builtAt = () => ct(D.meta.generatedIso || (D.meta.generated || "").replace(" UTC", "Z").replace(" ", "T")) || D.meta.generated;
const deadlineAt = () => ct(D.meta.tradeDeadlineIso || "2026-12-02T17:00:00Z", { weekday: "short" });
function dl(x, unit = "pts", d = 1, scale = 1) {

function save() {

}
function load() {

    Object.assign(S, o, { selA: new Set(o.selA || []), selB: new Set(o.selB || []), tf: Object.assign({}, S.tf, o.tf || {}) }); return true;

/* ------------------------------------------------------------ projections */
function avail(p, w) {
  const o = S.ov[p.id], r = p.weeks[w];
  if (o && o.status && o.status !== "auto") {
    const k = w - D.meta.week;
    if (o.status === "healthy") return 1;
    if (o.status === "q") return k === 0 ? 0.85 : 1;
    if (o.status === "out1") return k === 0 ? 0 : 1;
    if (o.status === "out2") return k <= 1 ? 0 : 1;
    if (o.status === "out3") return k <= 2 ? 0 : 1;
    if (o.status === "season") return 0;
  }
  return r.a ?? 1;
}
function projMean(p, w) {
  const r = p.weeks[w];
  if (!r || r.bye) return 0;
  if (r.locked) return r.mean;
  const adj = 1 + ((S.ov[p.id] && +S.ov[p.id].adj) || 0) / 100;
  const a = avail(p, w);
  if (p.pos === "DST") return Math.max(0, (p.base * adj + S.shrink * (r.addraw || 0)) * (2 - (r.oenv || 1))) * a;
  const m = r.mraw ? Math.min(1.2, Math.max(0.8, 1 + S.shrink * (r.mraw - 1))) : 1;
  return p.base * adj * m * (r.env || 1) * (r.h || 1) * a;
}
function projSd(p, w, mean) {

  const [a, b] = D.meta.sdModel[p.pos]; return a + b * mean;
}
let MEAN = null;  // MEAN[playerIdx][wi]
function computeMeans() {
  MEAN = PL.map((p) => WEEKS.map((w) => projMean(p, w)));
}

/* ------------------------------------------------------------ rosters + lineups */
function baseRoster(t) { return PL.filter((p) => p.fteam === t).map((p) => p.idx); }
function rosValue(i, from) { let s = 0; for (let k = 0; k < WEEKS.length; k++) if (WEEKS[k] >= from) s += MEAN[i][k]; return s; }

function lineup(ids, w) {
  const wi = w - 11, used = new Set(), out = [];
  const cand = ids.map((i) => PL[i]);
  // Week 11: players whose game is final are locked to where ESPN had them (started or benched).
  const locked = (p) => p.weeks[w] && p.weeks[w].locked;
  const slots = [["QB", ["QB"]], ["RB", ["RB"]], ["RB", ["RB"]], ["WR", ["WR"]], ["WR", ["WR"]], ["TE", ["TE"]], ["FLEX", ["RB", "WR", "TE"]], ["K", ["K"]], ["DST", ["DST"]]];
  const open = slots.map((s) => ({ name: s[0], elig: s[1], who: null }));
  if (w === D.meta.week) {
    for (const p of cand) {
      if (!locked(p) || p.slot === "BN" || p.slot === "IR" || p.slot === "FA") continue;
      const s = open.find((o) => !o.who && o.name === p.slot) || open.find((o) => !o.who && o.elig.includes(p.pos) && o.name === "FLEX");
      if (s) { s.who = p.idx; used.add(p.idx); }
    }
  }
  const pool = cand.filter((p) => !used.has(p.idx) && !(w === D.meta.week && locked(p))).sort((a, b) => MEAN[b.idx][wi] - MEAN[a.idx][wi]);
  for (const s of open) {
    if (s.who !== null) continue;
    const p = pool.find((p) => !used.has(p.idx) && s.elig.includes(p.pos));
    if (p) { s.who = p.idx; used.add(p.idx); }
  }
  for (const s of open) if (s.who !== null) out.push({ slot: s.name, i: s.who });
  return out;
}
function lineupPts(ids, w) { const wi = w - 11; return lineup(ids, w).reduce((s, x) => s + MEAN[x.i][wi], 0); }

function freeAgents() { return PL.filter((p) => p.fteam === 0).map((p) => p.idx); }
function bestFaAdd(ids, from, taken) {
  // the free agent who adds the most projected starting-lineup points from week `from` on
  const weeks = WEEKS.filter((w) => w >= from);
  const before = weeks.reduce((s, w) => s + lineupPts(ids, w), 0);
  const cands = freeAgents().filter((i) => !taken.has(i)).sort((a, b) => rosValue(b, from) - rosValue(a, from)).slice(0, 45);
  let best = null, gain = -1;
  for (const i of cands) {
    const g = weeks.reduce((s, w) => s + lineupPts([...ids, i], w), 0) - before;
    if (g > gain) { gain = g; best = i; }
  }
  return { i: best, gain };
}
function worstToDrop(ids, from, keep) {
  const weeks = WEEKS.filter((w) => w >= from);
  const total = (arr) => weeks.reduce((s, w) => s + lineupPts(arr, w), 0);
  const before = total(ids);
  let worst = null, loss = Infinity;
  for (const i of ids) {
    if (keep.has(i) || PL[i].slot === "IR") continue;
    const l = before - total(ids.filter((x) => x !== i)) + rosValue(i, from) * 0.02;  // tiny tie-break by raw value
    if (l < loss) { loss = l; worst = i; }
  }
  return { i: worst, loss };
}
function activeCount(ids) { return ids.filter((i) => PL[i].slot !== "IR").length; }

function tradeRosters(A, B, giveA, giveB, fill = S.fill) {
  // giveA / giveB: player indexes. Applies roster limits (drop least useful / add best free agent).
  const moves = [], baseA = baseRoster(A), baseB = baseRoster(B);
  let rA = baseA.filter((i) => !giveA.includes(i)).concat(giveB);
  let rB = baseB.filter((i) => !giveB.includes(i)).concat(giveA);
  const taken = new Set();
  const fix = (r, t, incoming, before) => {
    const limit = activeCount(before);
    while (activeCount(r) > limit) {
      const d = worstToDrop(r, S.eff, new Set(incoming)); if (d.i === null) break;
      r = r.filter((x) => x !== d.i); moves.push({ team: t, type: "drop", i: d.i });
    }
    if (fill) while (activeCount(r) < limit) {
      const a = bestFaAdd(r, S.eff, taken); if (a.i === null) break;
      taken.add(a.i); r = r.concat([a.i]); moves.push({ team: t, type: "add", i: a.i, gain: a.gain });
    }

}

  const t = tradeRosters(S.A, S.B, [...S.selA].map((id) => BYID[id].idx), [...S.selB].map((id) => BYID[id].idx));

}

/* ------------------------------------------------------------ Monte Carlo (common random numbers) */
function mix(x) { x ^= x >>> 16; x = Math.imul(x, 0x7feb352d); x ^= x >>> 15; x = Math.imul(x, 0x846ca68b); x ^= x >>> 16; return x >>> 0; }

function simulate(scn, N) {

  const ST = T.map((t) => WEEKS.map((w) => lineup(scn.rosters[t][w], w).map(({ i }) => {
    const p = PL[i], wi = w - 11, m = MEAN[i][wi], r = p.weeks[w];
    return { i, m, sd: projSd(p, w, m), rho: RHO[p.pos], nfl: NFLIDX[p.nfl] ?? 99, opp: r && r.opp ? NFLIDX[r.opp] ?? 99 : 99, dst: p.pos === "DST" };
  })));
  const proj = ST.map((tw) => tw.map((ss) => ss.reduce((s, x) => s + x.m, 0)));
  const sched = D.schedule.map((m) => ({ w: m.week, h: tix[m.home], a: tix[m.away] }));
  const res = { po: new Float64Array(nT), title: new Float64Array(nT), final: new Float64Array(nT), seed: T.map(() => new Float64Array(9)),
    wwin: T.map(() => new Float64Array(4)), semiWin: new Float64Array(nT), xw: new Float64Array(nT) };
  const score = new Float64Array(nT * 7), tf = new Float64Array(33 * 7);

    for (let wi = 0; wi < 7; wi++) for (let k = 0; k < 33; k++) tf[k * 7 + wi] = gauss(s, wi, 5000 + k);
    for (let k = 0; k < nT; k++) for (let wi = 0; wi < 7; wi++) {
      let tot = 0;
      for (const x of ST[k][wi]) {
        if (x.sd === 0) { tot += x.m; continue; }
        const zi = gauss(s, wi, x.i);
        const zt = x.dst ? -tf[(x.opp > 32 ? 32 : x.opp) * 7 + wi] : tf[(x.nfl > 32 ? 32 : x.nfl) * 7 + wi];
        const v = x.m + x.sd * (x.rho * zt + Math.sqrt(1 - x.rho * x.rho) * zi);

    }
    const wins = T.map((t) => { const tm = TEAM[t]; return tm.w + 0.5 * tm.t; });
    const pf = T.map((t) => TEAM[t].pf);
    for (const g of sched) {
      const wi = g.w - 11, sh = score[g.h * 7 + wi], sa = score[g.a * 7 + wi];
      pf[g.h] += sh; pf[g.a] += sa;
      if (sh > sa) { wins[g.h] += 1; res.wwin[g.h][wi] += 1; res.xw[g.h] += 1; } else { wins[g.a] += 1; res.wwin[g.a][wi] += 1; res.xw[g.a] += 1; }
    }

    order.forEach((k, r) => (res.seed[k][r] += 1));

    seed: res.seed.map(n), wwin: res.wwin.map(n) };
}

/* ------------------------------------------------------------ neutral value (points over waiver replacement) */
function replacement() {
  const rep = {};
  const fa = freeAgents();
  for (const pos of Object.keys(POS_ORDER)) rep[pos] = WEEKS.map((w, wi) => {
    let best = 0; for (const i of fa) if (PL[i].pos === pos && MEAN[i][wi] > best) best = MEAN[i][wi];
    return best;
  });
  return rep;
}
function vor(i, rep) {
  const p = PL[i]; let reg = 0, po = 0;
  WEEKS.forEach((w, wi) => {
    if (w < S.eff) return;
    const v = Math.max(0, MEAN[i][wi] - rep[p.pos][wi]);
    if (w <= 14) reg += v; else po += v;
  });
  return { reg, po };
}

/* ------------------------------------------------------------ run */
let runTimer = null;
function schedule() { clearTimeout(runTimer); $("status").textContent = "Simulating…"; runTimer = setTimeout(run, 30); }
function run() {
  const t0 = performance.now();
  computeMeans();
  const base = buildScenario(false), trade = buildScenario(true);
  const N = S.nsim;
  const s0 = simulate(base, N), s1 = (S.selA.size || S.selB.size) ? simulate(trade, N) : s0;
  const rep = replacement();
  R = { base, trade, s0, s1, rep, hasTrade: !!(S.selA.size || S.selB.size) };
  FIND = null;
  $("status").textContent = `${N.toLocaleString()} seasons simulated twice with the same random draws · ${Math.round(performance.now() - t0)} ms`;
  render(); save();
}

/* ------------------------------------------------------------ render: builder */
function teamOpt(sel, exclude) {
  return TEAMS.map((t) => `<option value="${t.id}" ${t.id === sel ? "selected" : ""} ${t.id === exclude ? "disabled" : ""}>${esc(t.name)}${t.id === D.meta.myTeam ? " (you)" : ""}</option>`).join("");
}
function injPill(p) {

  if (!p.inj) return "";

  const [t, c] = map[p.inj] || [p.inj.slice(0, 4), "q"];
  return `<span class="pill ${c}">${t}</span>`;
}
function renderSide(key) {

  const ps = PL.filter((p) => p.fteam === tid).sort((a, b) => POS_ORDER[a.pos] - POS_ORDER[b.pos] || b.base - a.base);
  const ros = (p) => { const ws = WEEKS.filter((w) => w >= S.eff); return ws.reduce((s, w) => s + MEAN[p.idx][w - 11], 0) / ws.length; };
  const rows = ps.map((p) => `<label class="prow ${sel.has(p.id) ? "sel" : ""}" for="c-${p.id}">
      <input type="checkbox" id="c-${p.id}" data-side="${key}" data-id="${p.id}" ${sel.has(p.id) ? "checked" : ""}>
      <span class="pos">${p.pos === "DST" ? "D/ST" : p.pos}</span>
      <span class="pname">${esc(p.name)}<span class="tm">${p.nfl || "FA"}</span>${injPill(p)}</span>
      <span class="pval num" data-tip="Average projected points per week, Week ${S.eff}–17">${f1(ros(p))}</span>
    </label>`).join("");

    <div class="side-head">
      <span class="swatch" style="background:var(--${key.toLowerCase()})"></span>
      <label for="team${key}" class="eyebrow">${key === "A" ? "Team A sends" : "Team B sends"}</label>

    </div>

/* ------------------------------------------------------------ render: verdict */
function teamCard(key) {
  const tid = S[key], k = R.s0.tix[tid], tm = TEAM[tid];
  const po0 = R.s0.po[k], po1 = R.s1.po[k], ti0 = R.s0.title[k], ti1 = R.s1.title[k];
  const xw0 = R.s0.xw[k], xw1 = R.s1.xw[k];

  else {
    const verdict = score > 0.01 ? "<b>Helps</b>" : score < -0.01 ? "<b>Hurts</b>" : "<b>Roughly neutral</b> for";
    line = `${verdict} ${esc(tm.name)}: weighted goal score ${dl(score, "%", 1, 100)} (${Math.round(S.regw * 100)}% playoff odds, ${Math.round((1 - S.regw) * 100)}% title odds).`;
  }
  const kpi = (lbl, a, b, fmt, tip) => `<div class="kpi" data-tip="${tip}"><div class="lbl">${lbl}</div><div class="big num">${fmt(b)}</div>
      <div class="from num">${R.hasTrade ? `was ${fmt(a)} · ${dl(b - a, fmt === pct ? "%" : "", fmt === pct ? 1 : 2, fmt === pct ? 100 : 1)}` : "&nbsp;"}</div></div>`;
  return `<div class="card">
    <div class="vhead"><span class="swatch" style="background:var(--${key.toLowerCase()})"></span><h3>${esc(tm.name)}</h3></div>
    <div class="kpis">
      ${kpi("Playoff odds", po0, po1, pct, "Chance to finish top 4 after Week 14")}
      ${kpi("Title odds", ti0, ti1, pct, "Chance to make the playoffs and win both rounds")}
      ${kpi("Wins left", xw0, xw1, (x) => x.toFixed(2), "Expected wins in the 4 remaining regular-season weeks")}
    </div>
    <div class="verdict-line">${line}</div>
  </div>`;
}
/* Fairness grading: expected wins added (EWA).
   Regular season: simulated change in win chance vs the real opponent each week.
   Playoff weeks: change in win chance vs a typical playoff team (normal model, sd = league weekly sd × √2),

const BANDS = [3, 6, 10];   // |gap| in win-probability points per week: even / edge / big edge / lopsided

}

    S.A = S.tf.team; S.B = r.P; S.selA = new Set(r.giveT.map((i) => PL[i].id)); S.selB = new Set(r.giveP.map((i) => PL[i].id));
    S.tab = "reg"; S.focus = "A"; window.scrollTo({ top: 0, behavior: "smooth" }); schedule();
  }
  else if (t.dataset.focus) { S.focus = t.dataset.focus; renderPanel(); save(); }
  else if (t.id === "swap") { [S.A, S.B] = [S.B, S.A]; [S.selA, S.selB] = [S.selB, S.selA]; schedule(); }
  else if (t.id === "clear") { S.selA.clear(); S.selB.clear(); schedule(); }
});
const tip = $("tip");
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
});
document.addEventListener("mousemove", (e) => {
  if (tip.hidden) return;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

/* ------------------------------------------------------------ boot */
fetch("data.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((data) => {
  D = data;
  PL = D.players; PL.forEach((p, i) => (p.idx = i));
  BYID = Object.fromEntries(PL.map((p) => [p.id, p]));
  TEAMS = D.teams; TEAM = Object.fromEntries(TEAMS.map((t) => [t.id, t]));
  NFLIDX = {}; Object.keys(D.nflSchedule).sort().forEach((t, k) => (NFLIDX[t] = k));
  const restored = load();
  if (!restored) {   // example trade so the page opens in a working state
    S.A = D.meta.myTeam; S.B = 6;
    const sw = PL.find((p) => p.name === "D'Andre Swift" && p.fteam === S.A), li = PL.find((p) => p.name === "Isaiah Likely" && p.fteam === S.B);
    if (sw && li) { S.selA.add(sw.id); S.selB.add(li.id); }
  }
  for (const id of [...S.selA]) if (!BYID[id] || BYID[id].fteam !== S.A) S.selA.delete(id);
  for (const id of [...S.selB]) if (!BYID[id] || BYID[id].fteam !== S.B) S.selB.delete(id);
  $("lg-name").textContent = D.meta.league + " Trade Desk";
  REG = REG.filter((w) => w >= D.meta.week);
  $("t-reg").textContent = REG.length ? `Regular season · Wk ${REG[0]}–14` : "Regular season (final)";
  for (const o of $("eff").options) o.disabled = +o.value < D.meta.week;
  if (S.eff < D.meta.week) S.eff = Math.min(14, D.meta.week + 1);
  $("eff").value = String(S.eff); $("shrink").value = S.shrink; $("shrink-o").textContent = Math.round(S.shrink * 100) + "%";
  $("regw").value = S.regw; $("regw-o").textContent = `${Math.round(S.regw * 100)}/${Math.round((1 - S.regw) * 100)}`;
  $("nsim").value = String(S.nsim); $("fill").checked = S.fill;
  $("meta").innerHTML = `<span><b>Week ${D.meta.week}</b> · ${D.meta.scoring}</span><span>Trade deadline <b>${esc(deadlineAt())}</b></span><span>Data built ${esc(builtAt())}</span>`;
  run();
}).catch((err) => { $("panel").innerHTML = `<div class="empty">Couldn't load the league data file (data.json): ${esc(err.message)}. Reload the page to try again.</div>`; });
})();
</script>
